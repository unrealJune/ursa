name: S2 binaries

# `s2` for every kind of machine a friend's node might be: static Linux (x86-64 and arm64, so it
# runs on any NAS or Raspberry Pi without caring about its libc), Windows and macOS. Download
# with `gh run download <run> -n s2-<target>`.

on:
  workflow_dispatch:
  push:
    paths:
      - spikes/s2-transfer/src/**
      - spikes/s2-transfer/Cargo.*
      - .github/workflows/s2-binaries.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, bin: s2 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, bin: s2 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, bin: s2.exe }
          - { os: macos-15, target: aarch64-apple-darwin, bin: s2 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/s2-transfer
    steps:
      - uses: actions/checkout@v4
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s2-transfer
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: s2-${{ matrix.target }}
          path: spikes/s2-transfer/target/${{ matrix.target }}/release/${{ matrix.bin }}
