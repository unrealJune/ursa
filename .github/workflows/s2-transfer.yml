name: S2 transfer

# A client and six storage nodes talking over iroh. Two setups:
#
# - loopback: everything on one machine, no shaping. The no-network ceiling.
# - shaped:   seven Linux network namespaces on one runner, joined by a bridge. Each node's
#             UPLOAD is throttled with netem to look like a home connection, one of them a
#             straggler, because a home uplink is what limits a read from friends' nodes. The
#             client's link is left alone (a fast home downlink). Paths are direct; relays off.
#
# Nodes on separate GitHub runners were tried first (run 45254098074): Azure's NAT defeated hole
# punching, every path fell back to n0's public relays, and they carried ~nothing. Relay
# throughput and real NAT traversal are measured on our own nodes instead.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per striped scenario
        default: "30"
      extra:
        description: Extra flags for `s2 fetch`
        default: ""

permissions:
  contents: read

env:
  SECONDS_PER: ${{ inputs.seconds || '30' }}
  EXTRA: ${{ inputs.extra }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spikes/s2-transfer
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s2-transfer
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: s2-bin
          path: spikes/s2-transfer/target/release/s2

  loopback:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s2-bin
      - name: run
        run: |
          chmod +x s2
          for i in 0 1 2 3 4 5; do ./s2 serve --local --seed lo --index $i --max-seconds 900 --ticket-out t$i.txt > serve$i.log 2>&1 & done
          for i in 0 1 2 3 4 5; do for _ in $(seq 60); do [ -s t$i.txt ] && break; sleep 1; done; done
          peers=""; for i in 0 1 2 3 4 5; do peers="$peers --peer $(cat t$i.txt)"; done
          ./s2 fetch --local $peers --seconds "$SECONDS_PER" --shutdown --label "loopback, one runner, no shaping" --json s2-loopback.json $EXTRA | tee s2-loopback.md
          cat s2-loopback.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-loopback
          path: s2-loopback.*

  shaped:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: spikes/s2-transfer/netns.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: s2-bin
      - name: network
        run: sudo bash spikes/s2-transfer/netns.sh up
      - name: run
        run: |
          chmod +x s2
          for i in 0 1 2 3 4 5; do sudo ip netns exec n$i ./s2 serve --local --seed shaped --index $i --max-seconds 1500 --ticket-out t$i.txt > serve$i.log 2>&1 & done
          for i in 0 1 2 3 4 5; do for _ in $(seq 60); do [ -s t$i.txt ] && break; sleep 1; done; done
          peers=""; for i in 0 1 2 3 4 5; do peers="$peers --peer $(cat t$i.txt)"; done
          label="uploads throttled to 100/50/40/20/200/8 Mbit/s, +15/30/25/50/10/90 ms"
          sudo ip netns exec client ./s2 fetch --local $peers --seconds "$SECONDS_PER" \
            --label "$label" --json s2-shaped.json $EXTRA | tee s2-shaped.md
          sudo ip netns exec client ./s2 fetch --local $peers --seconds "$SECONDS_PER" --strategies race,pull --per-node 4 \
            --label "$label; 4 requests in flight per node" --json s2-shaped-pn4.json $EXTRA | tee s2-shaped-pn4.md
          sudo ip netns exec client ./s2 fetch --local $peers --seconds "$SECONDS_PER" --strategies pull --window 4 --shutdown \
            --label "$label; window of 4 stripes (32 MiB, a phone's budget)" --json s2-shaped-w4.json $EXTRA | tee s2-shaped-w4.md
          cat s2-shaped.md s2-shaped-pn4.md s2-shaped-w4.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: tail -n 5 serve*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-shaped
          path: s2-shaped*

  # The same shaped network, with the fastest node (n4, 200 Mbit/s) failing four ways.
  faults:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: spikes/s2-transfer/netns.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: s2-bin
      - name: network
        run: sudo bash spikes/s2-transfer/netns.sh up
      - name: run
        run: |
          chmod +x s2
          NS=spikes/s2-transfer/netns.sh
          # `exec` so pid$i is the server itself: kill -9 is a crash, with no goodbye on the wire.
          start() {
            rm -f "t$1.txt"
            sudo ip netns exec "n$1" sh -c "echo \$\$ > pid$1; exec ./s2 serve --local --seed faults --index $1 --max-seconds 3000 --ticket-out t$1.txt" > "serve$1.log" 2>&1 &
            for _ in $(seq 60); do [ -s "t$1.txt" ] && break; sleep 1; done
          }
          peers() { p=""; for i in 0 1 2 3 4 5; do p="$p --peer $(cat t$i.txt)"; done; echo "$p"; }
          # One strategy per process, so a fault in one run cannot leak into the next.
          run() {
            name=$1; strategy=$2; shift 2
            sleep 10  # let queues from the previous run drain
            # shellcheck disable=SC2046
            sudo ip netns exec client ./s2 fetch --local $(peers) --seconds 60 --strategies "$strategy" --connect-seconds 20               --label "fastest node (n4) $name; $strategy; uploads 100/50/40/20/200/8 Mbit/s"               --json "s2-fault-$name-$strategy.json" "$@" | tee "s2-fault-$name-$strategy.md"
          }
          for i in 0 1 2 3 4 5; do start "$i"; done
          for st in race pull; do
            run healthy "$st"
            run killed-at-20s "$st" --fault-at 20 --fault "kill -9 $(cat pid4)"
            run offline "$st"
            start 4
            run blackholed-at-20s "$st" --fault-at 20 --fault "ip netns exec n4 tc qdisc change dev eth0 root netem loss 100%"
            sudo bash "$NS" restore 4
            run slowed-to-2mbit-at-20s "$st" --fault-at 20 --fault "ip netns exec n4 tc qdisc change dev eth0 root netem delay 10ms rate 2mbit limit 100000"
            sudo bash "$NS" restore 4
          done
          cat s2-fault-*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-faults
          path: s2-fault-*
