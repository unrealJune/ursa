name: S3 post-quantum libraries

# Interoperability checks and timings for X-Wing and ML-DSA-65 per library, on each desktop
# platform and under WebAssembly; plus build checks for the mobile and browser targets the
# apps ship to (nothing in CI can run an iOS or Android binary).

on:
  workflow_dispatch:
  push:
    paths:
      - spikes/s3-pq/src/**
      - spikes/s3-pq/Cargo.*
      - .github/workflows/s3-pq.yml

permissions:
  contents: read

jobs:
  run:
    name: run (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux-x86_64, features: "rustcrypto libcrux aws-lc" }
          - { os: ubuntu-24.04-arm, label: linux-arm64, features: "rustcrypto libcrux aws-lc" }
          - { os: macos-15, label: macos-arm64, features: "rustcrypto libcrux aws-lc" }
          # aws-lc-rs needs NASM on Windows x86-64; it is measured on the other three.
          - { os: windows-2025, label: windows-x86_64, features: "rustcrypto libcrux" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/s3-pq
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s3-pq
          key: ${{ matrix.label }}
      - run: cargo build --release --features "${{ matrix.features }}"
      - run: ./target/release/s3-pq | tee "s3-${{ matrix.label }}.md"
      - if: always()
        run: cat "s3-${{ matrix.label }}.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-${{ matrix.label }}
          path: spikes/s3-pq/s3-${{ matrix.label }}.md

  # WebAssembly under wasmtime: a stand-in for the browser's speed (same compiler output; a
  # browser's engine differs) with the pure-Rust libraries, the only kind that can go there.
  wasm-run:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spikes/s3-pq
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s3-pq
          key: wasip1
      - run: cargo build --release --target wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: run under wasmtime
        run: |
          wasmtime run target/wasm32-wasip1/release/s3-pq.wasm | sed 's/^# S3 results: wasm32 wasi/# S3 results: wasm32 (wasmtime)/' | tee s3-wasm32.md
      - if: always()
        run: cat s3-wasm32.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-wasm32
          path: spikes/s3-pq/s3-wasm32.md

  # Does each library build for each shipping target? A failure here is a result, not a bug,
  # so these never fail the workflow; the summary table says which built.
  build:
    name: build (${{ matrix.target }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-ios, features: "rustcrypto libcrux" }
          - { os: macos-15, target: aarch64-apple-ios, features: "aws-lc" }
          - { os: ubuntu-24.04, target: aarch64-linux-android, features: "rustcrypto libcrux" }
          - { os: ubuntu-24.04, target: aarch64-linux-android, features: "aws-lc" }
          - { os: ubuntu-24.04, target: wasm32-unknown-unknown, features: "rustcrypto libcrux" }
          - { os: ubuntu-24.04, target: wasm32-unknown-unknown, features: "aws-lc" }
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      # aws-lc's C is compiled for the SDK's newest iOS unless told otherwise, and then does not
      # link against Rust's (older) default target. The app sets this anyway.
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    defaults:
      run:
        shell: bash
        working-directory: spikes/s3-pq
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.target }}
      - name: build
        id: build
        run: |
          if [ "${{ matrix.target }}" = aarch64-linux-android ]; then
            bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
            export CXX_aarch64_linux_android="$bin/aarch64-linux-android26-clang++"
            export AR_aarch64_linux_android="$bin/llvm-ar"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
            export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          fi
          if [ "${{ matrix.target }}" = wasm32-unknown-unknown ]; then
            export RUSTFLAGS='--cfg getrandom_backend="wasm_js"'
          fi
          set +e
          cargo build --release --target ${{ matrix.target }} --no-default-features --features "${{ matrix.features }}" 2>&1 | tail -n 30
          status=${PIPESTATUS[0]}
          if [ "$status" = 0 ]; then result=builds; else result="**fails**"; fi
          echo "| ${{ matrix.target }} | ${{ matrix.features }} | $result |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
