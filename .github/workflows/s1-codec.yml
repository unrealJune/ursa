name: S1 codec bench

on:
  workflow_dispatch:
  push:
    paths:
      - spikes/s1-codec/**
      - .github/workflows/s1-codec.yml

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux-x86_64, features: aws-lc }
          - { os: ubuntu-24.04-arm, label: linux-arm64, features: aws-lc }
          # Apple silicon: the closest CI gets to an iPhone's cores.
          - { os: macos-15, label: macos-arm64, features: aws-lc }
          - { os: windows-2025, label: windows-x86_64, features: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/s1-codec
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --features "${{ matrix.features }}"
      - run: ./target/release/s1-codec --json "s1-${{ matrix.label }}.json" | tee "s1-${{ matrix.label }}.md"
      - run: cat "s1-${{ matrix.label }}.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: s1-${{ matrix.label }}
          path: |
            spikes/s1-codec/s1-${{ matrix.label }}.json
            spikes/s1-codec/s1-${{ matrix.label }}.md

  # A binary to run on a real Android phone over adb (`adb push s1-codec /data/local/tmp`).
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: spikes/s1-codec
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-linux-android
      - name: build
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          cargo build --release --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: s1-codec-android-arm64
          path: spikes/s1-codec/target/aarch64-linux-android/release/s1-codec
