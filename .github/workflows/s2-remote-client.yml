name: S2 remote client

# Reads from S2 nodes running somewhere else (a home network, friends' machines) from a GitHub
# runner: a client on the open internet with a fast downlink, so the result is bounded by the
# nodes' uplinks and by whether iroh gets a direct path to them.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: The nodes' seed
        required: true
      nodes:
        description: Number of nodes (indices 0..nodes-1)
        default: "5"
      k:
        description: Shards needed per stripe
        default: "4"
      seconds:
        description: Seconds per striped scenario
        default: "30"
      label:
        description: What and where the nodes are (copied into the report)
        default: ""
      extra:
        description: Extra flags for `s2 fetch`
        default: ""

permissions:
  contents: read

env:
  SEED: ${{ inputs.seed }}
  NODES: ${{ inputs.nodes }}
  K: ${{ inputs.k }}
  SECONDS_PER: ${{ inputs.seconds }}
  LABEL: ${{ inputs.label }}
  EXTRA: ${{ inputs.extra }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: spikes/s2-transfer
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s2-transfer
      - run: cargo build --release
      - name: fetch
        run: |
          # shellcheck disable=SC2086
          ./target/release/s2 fetch --seed "$SEED" --nodes "$NODES" --k "$K" --seconds "$SECONDS_PER" --connect-seconds 120 \
            --label "$LABEL; client: GitHub runner (Azure, US)" --json remote.json $EXTRA | tee remote.md
          cat remote.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-remote
          path: spikes/s2-transfer/remote.*
