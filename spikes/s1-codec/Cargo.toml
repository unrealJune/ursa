[package]
name = "s1-codec"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike S1: chunking, encryption, erasure coding and hashing throughput"

[dependencies]
aes-gcm = "0.10"
blake3 = "1"
chacha20poly1305 = "0.10"
fastcdc = "3"
rayon = "1"
reed-solomon-simd = "3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
