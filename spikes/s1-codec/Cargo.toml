[package]
name = "s1-codec"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike S1: chunking, encryption, erasure coding and hashing throughput"

[features]
# aws-lc-rs needs CMake (and a C toolchain) to build; CI turns it on where that is easy.
aws-lc = ["dep:aws-lc-rs"]

[dependencies]
aes-gcm = "0.10"
aws-lc-rs = { version = "1", optional = true }
blake3 = "1"
chacha20poly1305 = "0.10"
fastcdc = "3"
rayon = "1"
reed-solomon-simd = "3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aes_armv8)", "cfg(polyval_armv8)"] }

[profile.release]
codegen-units = 1
lto = "thin"
