[workspace]
resolver = "3"
members = ["crates/*"]
# Each spike is its own throwaway project with its own lockfile.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ursa-core = { path = "crates/ursa-core" }
ursa-proto = { path = "crates/ursa-proto" }

anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
ed25519-dalek = "3"
libcrux-kem = "0.0.11"
libcrux-ml-dsa = "0.0.12"
reed-solomon-simd = "3"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fastcdc = "3"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
iroh = "1.4"
iroh-tickets = "1"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 4
lto = "thin"
